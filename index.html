<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ארקייד המספרים של אלון – V17</title>
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="icon-button hidden" aria-label="חזרה למסך הבית">🏠</button>
      <div class="brand"><span aria-hidden="true">🎮</span><span>ארקייד המספרים של אלון</span></div>
      <div class="top-actions">
        <button id="soundBtn" class="icon-button" aria-label="השתקת קול">🔊</button>
        <button id="fullscreenBtn" class="icon-button" aria-label="מסך מלא">⛶</button>
      </div>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="confetti" class="confetti-layer" aria-hidden="true"></div>
  </div>

  <template id="home-template">
    <section class="home-screen arcade-home">
      <div class="hero-card arcade-hero">
        <div>
          <p class="eyebrow">לומדים מספרים דרך משחק</p>
          <h1>איזה משחק בא לך?</h1>
          <p class="subtitle">הספרה תמיד מופיעה בגדול. אפשר לשחק גם בלי לקרוא.</p>
        </div>
        <div class="hero-arcade" aria-hidden="true">🏎️ 🐸 🎯 🚂</div>
      </div>

      <section class="game-section">
        <div class="section-title"><span>⚡</span><strong>אקשן</strong></div>
        <div class="game-grid arcade-grid">
          <button class="game-card action-game favorite-game" data-route="catch"><span class="favorite-badge">⭐ אהוב</span><span class="game-icon">🏎️</span><strong>מרוץ המספרים</strong><small>לוחצים על המספר ומקדמים את המכונית</small></button>
          <button class="game-card" data-route="frog"><span class="game-icon">🐸</span><strong>הצפרדע הרעבה</strong><small>הצפרדע בולעת את המספר הנכון</small></button>
          <button class="game-card" data-route="cannon"><span class="game-icon">🎯</span><strong>תותח המספרים</strong><small>מפוצצים את המטרה הנכונה</small></button>
          <button class="game-card" data-route="obstacle"><span class="game-icon">🚧</span><strong>מרוץ מכשולים</strong><small>פותחים את השער הנכון וממשיכים</small></button>
          <button class="game-card" data-route="fishing"><span class="game-icon">🎣</span><strong>דגים מספרים</strong><small>מכוונים את החכה ותופסים את הדג הנכון</small></button>
          <button class="game-card" data-route="dino"><span class="game-icon">🦖</span><strong>דינו המספרים</strong><small>רצים, קופצים ותופסים את המספר הנכון</small></button>
          <button class="game-card" data-route="runaway"><span class="game-icon">💨</span><strong>המספר הבורח</strong><small>תופסים את המספר שזז על המסך</small></button>
        </div>
      </section>

      <section class="game-section">
        <div class="section-title"><span>🔢</span><strong>מספר וכמות</strong></div>
        <div class="game-grid arcade-grid">
          <button class="game-card primary-game" data-route="train"><span class="game-icon">🚂</span><strong>רכבת המספרים</strong><small>מכניסים לכל קרון את הכמות המתאימה</small></button>
          <button class="game-card" data-route="monster"><span class="game-icon">👾</span><strong>המפלצת הרעבה</strong><small>מאכילים בדיוק לפי הספרה</small></button>
          <button class="game-card" data-route="rescue"><span class="game-icon">🐾</span><strong>רכבת ההצלה</strong><small>מעלים את מספר החיות המתאים</small></button>
          <button class="game-card" data-route="tower"><span class="game-icon">🧱</span><strong>בונים מגדל</strong><small>בונים מספר קוביות לפי הספרה</small></button>
          <button class="game-card" data-route="parking"><span class="game-icon">🅿️</span><strong>החניון</strong><small>מחנים במקום עם המספר הנכון</small></button>
        </div>
      </section>

      <section class="game-section">
        <div class="section-title"><span>🧩</span><strong>סדר המספרים</strong></div>
        <div class="game-grid arcade-grid">
          <button class="game-card" data-route="bridge"><span class="game-icon">🌉</span><strong>הגשר השבור</strong><small>ממלאים את החור במספר שחסר</small></button>
          <button class="game-card" data-route="frogjump"><span class="game-icon">🪷</span><strong>קפיצות הצפרדע</strong><small>קופצים על המספרים לפי הסדר</small></button>
        </div>
      </section>

      <div class="parent-strip">
        <span>שלב:</span>
        <div class="segmented level-picker" aria-label="בחירת שלב">
          <button data-range="5">1–5</button><button data-range="6">1–6</button><button data-range="7">1–7</button>
          <button data-range="8">1–8</button><button data-range="9">1–9</button><button data-range="10">1–10</button>
        </div>
        <span class="progress-note" id="homeProgress"></span>
      </div>
    </section>
  </template>

  <template id="catch-template">
    <section class="race-screen">
      <div class="screen-heading race-heading">
        <div><p class="eyebrow">משחק אקשן</p><h1>מרוץ המספרים</h1></div>
        <div class="race-mission" aria-label="המספר שצריך לבחור" aria-live="polite">
          <span class="race-mission-icon" aria-hidden="true">🎯</span><strong id="raceMissionNumber">?</strong>
        </div>
        <button id="repeatCatchBtn" class="sound-only-button" aria-label="השמעת המספר שוב">🔊</button>
      </div>
      <div class="race-course">
        <div class="race-sky" aria-hidden="true">☁️ <span>☁️</span></div>
        <div class="race-road">
          <div class="finish-line" aria-hidden="true">🏁</div>
          <div id="raceCountdown" class="race-countdown" aria-hidden="true"></div>
          <div id="raceCar" class="race-car" aria-hidden="true">🏎️</div>
          <div class="race-progress" aria-label="התקדמות במרוץ"><div id="raceProgressFill" class="race-progress-fill"></div></div>
        </div>
        <div class="target-zone">
          <div id="catchArena" class="target-row" aria-label="מטרות עם מספרים"></div>
          <div id="raceFeedback" class="race-feedback" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </template>

  <template id="train-template">
    <section class="train-screen">
      <div class="train-topline">
        <div class="instruction-card">
          <button id="repeatTrainBtn" class="sound-only-button compact-sound" aria-label="השמעת המספר שוב" type="button">🔊</button>
          <div><p class="eyebrow">המשימה</p><h1 id="trainInstruction"></h1></div>
        </div>
        <div class="round-counter"><span id="roundCurrent"></span>/<span id="roundTotal"></span></div>
      </div>
      <div class="train-track"><div class="engine" aria-hidden="true">🚂</div><div id="wagons" class="wagons"></div></div>
      <div class="tray-card">
        <div class="tray-heading"><strong id="trayLabel"></strong><span>אפשר לגרור באצבע או ללחוץ</span></div>
        <div id="objectTray" class="object-tray"></div>
      </div>
    </section>
  </template>

  <script src="app.js?v=17"></script>
</body>
</html>
